<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a3a5c"/>
      <stop offset="0.55" stop-color="#3d6a9a"/>
      <stop offset="1" stop-color="#7ca7c8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2c4d6a"/>
      <stop offset="1" stop-color="#0e1c2e"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#213a54"/>
      <stop offset="1" stop-color="#0e2233"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="480" fill="url(#sky)"/>

  <!-- distant mountains -->
  <polygon points="0,420 200,300 380,380 560,260 760,360 940,240 1140,340 1340,280 1600,340 1600,480 0,480"
           fill="#4a6d8f" opacity="0.75"/>
  <polygon points="0,470 240,360 460,420 660,320 880,400 1080,300 1300,380 1600,340 1600,500 0,500"
           fill="#3a5876" opacity="0.9"/>

  <!-- city skyline -->
  <g fill="url(#skyline)">
    <rect x="0" y="360" width="80" height="180"/>
    <rect x="80" y="330" width="60" height="210"/>
    <rect x="140" y="380" width="100" height="160"/>
    <rect x="240" y="300" width="70" height="240"/>
    <rect x="310" y="340" width="90" height="200"/>
    <rect x="400" y="270" width="80" height="270"/>
    <rect x="480" y="320" width="60" height="220"/>
    <rect x="540" y="250" width="100" height="290"/>
    <rect x="640" y="290" width="70" height="250"/>
    <rect x="710" y="230" width="90" height="310"/>
    <rect x="800" y="280" width="60" height="260"/>
    <rect x="860" y="310" width="80" height="230"/>
    <rect x="940" y="260" width="100" height="280"/>
    <rect x="1040" y="330" width="70" height="210"/>
    <rect x="1110" y="290" width="90" height="250"/>
    <rect x="1200" y="340" width="80" height="200"/>
    <rect x="1280" y="270" width="100" height="270"/>
    <rect x="1380" y="330" width="70" height="210"/>
    <rect x="1450" y="300" width="90" height="240"/>
    <rect x="1540" y="360" width="60" height="180"/>
  </g>

  <!-- city window dots -->
  <g fill="#ffb763" opacity="0.55">
    <rect x="20"   y="410" width="4" height="6"/>
    <rect x="98"   y="360" width="4" height="6"/>
    <rect x="270"  y="330" width="4" height="6"/>
    <rect x="428"  y="290" width="4" height="6"/>
    <rect x="580"  y="270" width="4" height="6"/>
    <rect x="742"  y="250" width="4" height="6"/>
    <rect x="880"  y="340" width="4" height="6"/>
    <rect x="980"  y="280" width="4" height="6"/>
    <rect x="1140" y="310" width="4" height="6"/>
    <rect x="1320" y="290" width="4" height="6"/>
    <rect x="1480" y="320" width="4" height="6"/>
    <rect x="150"  y="420" width="4" height="6"/>
    <rect x="330"  y="380" width="4" height="6"/>
    <rect x="500"  y="360" width="4" height="6"/>
    <rect x="660"  y="330" width="4" height="6"/>
    <rect x="820"  y="320" width="4" height="6"/>
    <rect x="1010" y="360" width="4" height="6"/>
    <rect x="1230" y="360" width="4" height="6"/>
    <rect x="1410" y="380" width="4" height="6"/>
  </g>

  <!-- water -->
  <rect y="540" width="1600" height="260" fill="url(#water)"/>

  <!-- reflection shimmer -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0"   y1="580" x2="1600" y2="580"/>
    <line x1="0"   y1="620" x2="1600" y2="620"/>
    <line x1="0"   y1="660" x2="1600" y2="660"/>
    <line x1="0"   y1="700" x2="1600" y2="700"/>
    <line x1="0"   y1="740" x2="1600" y2="740"/>
  </g>

  <!-- autumn foreground trees hint -->
  <g fill="#c46a25" opacity="0.85">
    <ellipse cx="1500" cy="560" rx="90" ry="60"/>
    <ellipse cx="1400" cy="580" rx="80" ry="50"/>
    <ellipse cx="1300" cy="565" rx="70" ry="45"/>
  </g>
</svg>
